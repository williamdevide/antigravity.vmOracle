<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antigravity Cloud Orchestrator — Oracle VM & Deploy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              oracle: {
                500: '#f80000',
                600: '#d90000',
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: Inter, system-ui, -apple-system, sans-serif;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      html.dark body {
        background-color: #0b0f19;
        color: #f1f5f9;
      }
      html.light body {
        background-color: #f8fafc;
        color: #0f172a;
      }
      /* =========================================================================
         TEMA CLARO (LIGHT MODE) — ESTÉTICA PROFISSIONAL E LIMPA
         ========================================================================= */
      html.light main {
        background-color: #f8fafc;
        color: #0f172a;
      }
      html.light aside {
        background-color: #ffffff !important;
        border-color: #e2e8f0 !important;
      }
      html.light [class*="bg-slate-950"] {
        background-color: #f8fafc !important;
        border-color: #e2e8f0 !important;
        color: #0f172a !important;
      }
      html.light [class*="bg-slate-900"] {
        background-color: #ffffff !important;
        border-color: #e2e8f0 !important;
        color: #0f172a !important;
      }
      html.light [class*="bg-slate-800"] {
        background-color: #f1f5f9 !important;
        border-color: #e2e8f0 !important;
        color: #1e293b !important;
      }
      html.light [class*="border-slate-800"],
      html.light [class*="border-slate-700"] {
        border-color: #e2e8f0 !important;
      }
      html.light .text-white {
        color: #0f172a !important;
      }
      html.light .text-slate-100,
      html.light .text-slate-200,
      html.light .text-slate-300 {
        color: #1e293b !important;
      }
      html.light .text-slate-400 {
        color: #64748b !important;
      }
      html.light .text-slate-500 {
        color: #94a3b8 !important;
      }
      /* Inputs & Formulários no Tema Claro */
      html.light input:not([type="checkbox"]):not([type="radio"]),
      html.light select,
      html.light textarea {
        background-color: #ffffff !important;
        color: #0f172a !important;
        border-color: #cbd5e1 !important;
      }
      html.light input:focus,
      html.light select:focus,
      html.light textarea:focus {
        border-color: #3b82f6 !important;
        box-shadow: 0 0 0 1px #3b82f6 !important;
      }
      /* Terminais e Logs continuam com visual escuro de alto contraste */
      html.light pre,
      html.light code,
      html.light [class*="bg-black"] {
        background-color: #0f172a !important;
        color: #38bdf8 !important;
        border-color: #1e293b !important;
      }
      /* Modais no Tema Claro */
      html.light .fixed.inset-0.bg-black\/80 {
        background-color: rgba(15, 23, 42, 0.45) !important;
      }
      html.light .relative.bg-slate-900 {
        background-color: #ffffff !important;
        border-color: #e2e8f0 !important;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.06) !important;
      }
    </style>
  </head>
  <body class="min-h-screen antialiased selection:bg-blue-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
